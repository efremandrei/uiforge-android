name: Build downloadable APK release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug lintDebug
          else
            gradle --no-daemon assembleDebug lintDebug
          fi

      - name: Read app version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import re
          from pathlib import Path

          version_name = ""
          version_code = ""
          for gradle_file in (Path("app/build.gradle"), Path("app/build.gradle.kts")):
              if not gradle_file.exists():
                  continue

              match = re.search(
                  r'^\s*versionName\s*(?:=|\s)\s*["\']?([^"\'\s]+)',
                  gradle_file.read_text(encoding="utf-8", errors="ignore"),
                  re.MULTILINE,
              )
              if match:
                  version_name = match.group(1)
                  code_match = re.search(r'^\s*versionCode\s*(?:=|\s)\s*(\d+)', gradle_file.read_text(encoding="utf-8"), re.MULTILINE)
                  version_code = code_match.group(1) if code_match else os.environ['GITHUB_RUN_NUMBER']
                  break

          if not version_name:
              version_name = f"0.0.{os.environ['GITHUB_RUN_NUMBER']}"

          safe_version = re.sub(r"[^A-Za-z0-9._-]+", "-", version_name).strip("-")
          print(f"APP_VERSION={safe_version or '0.0.' + os.environ['GITHUB_RUN_NUMBER']}")
          print(f"APP_BUILD={version_code or os.environ['GITHUB_RUN_NUMBER']}")
          PY

      - name: Prepare versioned downloadable APK
        shell: bash
        run: |
          mkdir -p release
          repo_name="${GITHUB_REPOSITORY#*/}"
          apk_path="$(find . -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)"

          if [ -z "$apk_path" ]; then
            echo "No debug APK was produced."
            find . -path '*/build/outputs/*' -type f || true
            exit 1
          fi

          versioned_apk="release/${repo_name}-v${APP_VERSION}-build-${APP_BUILD}-debug.apk"
          cp "$apk_path" "$versioned_apk"

          echo "APK_PATH=$versioned_apk" >> "$GITHUB_ENV"

      - name: Publish downloadable GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: debug-v${{ env.APP_VERSION }}
          name: Debug APK v${{ env.APP_VERSION }}
          body: |
            Automatically built debug APK from the latest default-branch commit.

            APK file name includes the app version and build number. For in-place updates, use the separately published review release that preserves the existing signing certificate.
          artifacts: ${{ env.APK_PATH }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
